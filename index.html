<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subeesh Custom HLS Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; text-align: center; margin: 0; }
        .container { padding: 20px; }
        video { width: 100%; max-width: 800px; border: 2px solid #333; border-radius: 10px; }
        h2 { color: #f1c40f; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sun TV HDR Player</h2>
    <video id="video" controls autoplay></video>
</div>

<script>
    var video = document.getElementById('video');
    var videoSrc = 'https://livestream10.sunnxt.com/DolbyVision/SunTV_HDR/SunTV_HDR_Endpoints/SunTV-HDR10-IN-index.m3u8';

    if (Hls.isSupported()) {
        var hls = new Hls();
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play();
        });
    }
    // Safari மற்றும் iOS பிரவுசர்களில் நேட்டிவ் சப்போர்ட் இருக்கும்
    else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = videoSrc;
        video.addEventListener('loadedmetadata', function() {
            video.play();
        });
    }
</script>

</body>
</html>
