<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subeesh Custom Player</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    <style>
        body { background: #000; color: #fff; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .player-container { width: 95%; max-width: 800px; text-align: center; }
        video { width: 100%; border-radius: 12px; }
        h3 { color: #3498db; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="player-container">
    <h3>Sun TV HDR - Live</h3>
    <video id="player" playsinline controls></video>
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
    const video = document.getElementById('player');
    const source = 'https://livestream10.sunnxt.com/DolbyVision/SunTV_HDR/SunTV_HDR_Endpoints/SunTV-HDR10-IN-index.m3u8';
    
    // அழகான டிசைனுக்காக Plyr-ஐ இணைக்கிறோம்
    const player = new Plyr(video);

    // HLS (m3u8) சப்போர்ட்
    if (Hls.isSupported()) {
        const hls = new Hls({
            xhrSetup: function(xhr) {
                xhr.withCredentials = false;
            }
        });
        // CORS தடையை உடைக்க Proxy வழியாக அனுப்புகிறோம்
        const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(source);
        
        hls.loadSource(proxyUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play().catch(e => console.log("Auto-play blocked"));
        });
    } 
    else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = source;
    }
</script>

</body>
</html>
