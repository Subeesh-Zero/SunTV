<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live Stream Player</title>
    
    <style>
        /* --- 1. CLEAN CENTER LAYOUT --- */
        body {
            background-color: #000; /* கருப்பு பின்னணி */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 2. VIDEO PLAYER STYLE --- */
        video {
            width: 100%;
            max-width: 1000px; /* வீடியோ அளவு */
            height: auto;
            max-height: 100vh;
            outline: none;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <!-- VIDEO PLAYER (Link will be added automatically via Script) -->
    <video id="video" controls autoplay muted playsinline></video>

    <!-- jQuery Library -->
    <script src="https://code.jquery.com/jquery-2.1.4.min.js"></script>

    <script type="text/javascript">
        $(document).ready(function() {
            
            // ======================================================
            // 👇 இங்கே உங்கள் வீடியோ லிங்கை பேஸ்ட் செய்யவும் (PASTE URL HERE) 👇
            // ======================================================
            
            var myStreamURL = "https://livestream10.sunnxt.com/DolbyVision/SunTV_HDR/SunTV_HDR_Endpoints/SunTV-HDR10-IN-index.m3u8";

            // ======================================================
            
            var video = document.getElementById('video');
            var $video = $(video);

            // 1. Load the URL automatically
            $video.html('<source src="' + myStreamURL + '" type="application/x-mpegURL">');
            video.load();
            
            // Try to play
            var playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => { console.log("Autoplay waiting for click"); });
            }

            // --- 2. AUDIO LATENCY FIX (ஆடியோ சிங்க் சரி செய்தல்) ---
            setInterval(function() {
                if (video.readyState === 4 && !video.paused) {
                    // Check seekable range (Live Edge)
                    var seekable = video.seekable;
                    if (seekable.length > 0) {
                        var liveEnd = seekable.end(seekable.length - 1);
                        var current = video.currentTime;
                        
                        // வீடியோ லைவ் டைம் விட 6 நொடிகள் பின் தங்கி இருந்தால் உடனே சரி செய்யும்
                        if ((liveEnd - current) > 6) {
                            console.log("Fixing Audio Latency...");
                            video.currentTime = liveEnd - 1; 
                        }
                    }
                }
            }, 5000); // Check every 5 seconds

            // --- 3. ANTI-FREEZE FIX (வீடியோ நிற்காமல் ஓட) ---
            var lastTime = 0;
            var stuckCount = 0;

            setInterval(function() {
                if (!video.paused) {
                    // வீடியோ ஒரே இடத்தில் நின்றால் (Frozen)
                    if (video.currentTime === lastTime) {
                        stuckCount++;
                        // 2 வினாடிக்கு மேல் நின்றால் ரீலோட் செய்யும்
                        if (stuckCount > 2) {
                            console.log("Stream Stuck. Reloading...");
                            video.load(); 
                            video.play();
                            stuckCount = 0;
                        }
                    } else {
                        stuckCount = 0;
                        lastTime = video.currentTime;
                    }
                }
            }, 1000);

        });
    </script>

</body>
</html>
