<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subeesh Pro Player</title>
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .container { width: 100%; max-width: 800px; padding: 10px; text-align: center; }
        video { width: 100%; border-radius: 10px; background: #111; }
        h2 { color: #38bdf8; margin-bottom: 15px; }
        #status { margin-top: 10px; color: #888; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Sun TV HDR - Live</h2>
        <div class="player-wrapper">
            <video id="player" playsinline controls></video>
        </div>
        <div id="status">லோடிங்... (Loading)</div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        const video = document.getElementById('player');
        const status = document.getElementById('status');

        // Plyr செட்டிங்ஸ்
        const player = new Plyr(video, {
            speed: { selected: 1, options: [0.5, 1, 2, 4, 16] }
        });

        // உங்கள் லிங்க் மற்றும் Proxy (CORS தடையை உடைக்க இது மிக முக்கியம்)
        const rawUrl = 'https://livestream10.sunnxt.com/DolbyVision/SunTV_HDR/SunTV_HDR_Endpoints/SunTV-HDR10-IN-index.m3u8';
        const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(rawUrl);

        function startPlayback() {
            if (Hls.isSupported()) {
                const hls = new Hls({
                    xhrSetup: function(xhr, url) {
                        xhr.withCredentials = false;
                    }
                });

                // முதலில் ப்ராக்ஸி வழியாக லோட் செய்யும்
                hls.loadSource(proxyUrl);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    status.innerText = "நேரலை ஓடிக்கொண்டிருக்கிறது (Proxy Active)";
                    video.play().catch(() => {
                        status.innerText = "Play பட்டனை அழுத்தவும்...";
                    });
                });

                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        // ஒருவேளை ப்ராக்ஸி தோற்றால் நேரடியாக முயற்சிக்கும்
                        console.log("Trying direct connection...");
                        hls.loadSource(rawUrl);
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = rawUrl;
                video.play();
            }
        }

        window.onload = startPlayback;
    </script>
</body>
</html>
