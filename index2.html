<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Uploader · Ngrok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #1e2b3f 0%, #0f1a2b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
            padding: 2.5rem 2rem;
            color: #eef4ff;
        }
        h1 {
            font-weight: 600;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .url-input {
            margin-bottom: 2rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #b0c4de;
        }
        input[type="url"] {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: #1e293b;
            border: 1px solid #3b4a5e;
            border-radius: 2rem;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }
        input[type="url"]:focus {
            border-color: #3b82f6;
        }
        .file-area {
            margin-top: 2rem;
            border-top: 1px solid #334155;
            padding-top: 2rem;
        }
        .file-label {
            display: block;
            background: #1e293b;
            border: 2px dashed #475569;
            border-radius: 1.5rem;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1.5rem;
        }
        .file-label:hover {
            border-color: #3b82f6;
            background: #263445;
        }
        .file-label i {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.5rem;
        }
        #fileInput {
            display: none;
        }
        .btn {
            background: linear-gradient(to right, #3b82f6, #2563eb);
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.9rem 1.8rem;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 8px 16px -4px #1e3a8a50;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -6px #1e3a8a;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #64748b;
        }
        #status {
            background: #111c2e;
            border-radius: 1.2rem;
            padding: 1.5rem;
            margin: 1.5rem 0;
            font-family: monospace;
            border: 1px solid #2d3a4e;
            word-break: break-word;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        a {
            color: #60a5fa;
            text-decoration: none;
        }
        a:hover { text-decoration: underline; }
        .footer-note {
            font-size: 0.8rem;
            color: #5f7a9e;
            margin-top: 1.8rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📡 Telegram Bridge</h1>

        <!-- Server URL input -->
        <div class="url-input">
            <label for="serverUrl">🌐 Ngrok Server URL (from terminal)</label>
            <input type="url" id="serverUrl" placeholder="https://xxxx.ngrok-free.app" value="http://localhost:8080">
            <p style="font-size:0.8rem; margin-top:0.4rem; color:#9aaec9;">Paste the ngrok URL shown in the Python terminal</p>
        </div>

        <!-- Upload area -->
        <div class="file-area">
            <label for="fileInput" class="file-label" id="fileLabel">
                <i>📎</i>
                <span>Click to choose a file</span>
            </label>
            <input type="file" id="fileInput">

            <button class="btn" id="uploadBtn" disabled>⬆️ Upload to Telegram</button>
            <div id="status">Ready to upload...</div>
        </div>

        <div class="footer-note">
            Frontend hosted on GitHub Pages · Backend runs on your machine (ngrok)
        </div>
    </div>

    <script>
        (function() {
            // Elements
            const serverUrlInput = document.getElementById('serverUrl');
            const fileInput = document.getElementById('fileInput');
            const fileLabel = document.getElementById('fileLabel');
            const uploadBtn = document.getElementById('uploadBtn');
            const statusDiv = document.getElementById('status');

            let currentServerUrl = serverUrlInput.value.trim();

            // Update server URL on change
            serverUrlInput.addEventListener('input', function() {
                currentServerUrl = this.value.trim();
                // Remove trailing slash if present
                if (currentServerUrl.endsWith('/')) {
                    currentServerUrl = currentServerUrl.slice(0, -1);
                }
            });

            // File selection
            fileInput.addEventListener('change', function() {
                if (this.files.length > 0) {
                    fileLabel.innerHTML = `<i>📄</i><span>${this.files[0].name}</span>`;
                    uploadBtn.disabled = false;
                } else {
                    fileLabel.innerHTML = `<i>📎</i><span>Click to choose a file</span>`;
                    uploadBtn.disabled = true;
                }
            });

            // Upload button
            uploadBtn.addEventListener('click', async function() {
                const file = fileInput.files[0];
                if (!file) {
                    statusDiv.innerHTML = '<span class="error">❌ No file selected</span>';
                    return;
                }

                if (!currentServerUrl) {
                    statusDiv.innerHTML = '<span class="error">❌ Server URL is empty</span>';
                    return;
                }

                const formData = new FormData();
                formData.append('file', file);

                statusDiv.innerHTML = '<span>⏳ Uploading to Telegram... (please wait)</span>';
                uploadBtn.disabled = true;

                try {
                    const response = await fetch(`${currentServerUrl}/upload`, {
                        method: 'POST',
                        body: formData,
                        mode: 'cors'
                    });

                    if (!response.ok) {
                        const errText = await response.text();
                        throw new Error(`Server error (${response.status}): ${errText}`);
                    }

                    const data = await response.json();
                    if (data.success) {
                        const downloadUrl = `${currentServerUrl}${data.download_url}`;
                        statusDiv.innerHTML = `
                            <span class="success">✅ Upload successful!</span><br>
                            📥 <a href="${downloadUrl}" target="_blank">${downloadUrl}</a><br>
                            <small>(right‑click → save as)</small>
                        `;
                    } else {
                        statusDiv.innerHTML = `<span class="error">❌ Upload failed: ${data.error}</span>`;
                    }
                } catch (error) {
                    statusDiv.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
                } finally {
                    uploadBtn.disabled = false;
                }
            });

            // Drag & drop
            fileLabel.addEventListener('dragover', (e) => {
                e.preventDefault();
                fileLabel.style.borderColor = '#3b82f6';
                fileLabel.style.background = '#263445';
            });
            fileLabel.addEventListener('dragleave', (e) => {
                e.preventDefault();
                fileLabel.style.borderColor = '#475569';
                fileLabel.style.background = '#1e293b';
            });
            fileLabel.addEventListener('drop', (e) => {
                e.preventDefault();
                fileLabel.style.borderColor = '#475569';
                fileLabel.style.background = '#1e293b';
                if (e.dataTransfer.files.length > 0) {
                    fileInput.files = e.dataTransfer.files;
                    fileLabel.innerHTML = `<i>📄</i><span>${e.dataTransfer.files[0].name}</span>`;
                    uploadBtn.disabled = false;
                }
            });
        })();
    </script>
</body>
</html>
