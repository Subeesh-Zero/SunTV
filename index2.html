<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>ProjectAxis - Direct Uploader</title>
    <script src="https://cdn.jsdelivr.net/npm/gramjs/dist/gramjs.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #eef2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 400px; }
        #linkContainer { margin-top: 20px; padding: 15px; background: #d4edda; border-radius: 5px; display: none; word-break: break-all; }
        input[type="text"] { width: 90%; padding: 8px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ProjectAxis Uploader</h2>
        <input type="file" id="fileInput"><br><br>
        <button id="uploadBtn" onclick="uploadToTelegram()">Upload Now</button>
        <div id="status" style="margin-top: 20px;"></div>
        <div id="linkContainer">
            <div>✅ லிங்க் தயார்:</div>
            <input type="text" id="downloadURL" readonly>
        </div>
    </div>

    <script>
        async function uploadToTelegram() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status');
            const btn = document.getElementById('uploadBtn');

            if (!fileInput.files.length) return alert("File-ஐத் தேர்ந்தெடுக்கவும்!");

            btn.disabled = true;
            status.innerText = "இணைகிறது...";

            try {
                // GramJS Initialization
                const { TelegramClient } = window.gramjs;
                const { StringSession } = window.gramjs.sessions;
                
                const session = new StringSession("உங்கள்_நீண்ட_SESSION_STRING_இங்கே");
                const client = new TelegramClient(session, 22338436, "dfc5f483a41f358cca2299d01ebe2bee", { connectionRetries: 5 });
                
                await client.connect();
                status.innerText = "அப்லோட் ஆகிறது...";

                const result = await client.sendFile("me", {
                    file: fileInput.files[0],
                    chunkSize: 512 * 1024,
                    progressCallback: (p) => status.innerText = `அப்லோட்: ${Math.round(p * 100)}%`
                });

                const messageId = result.id;
                document.getElementById('downloadURL').value = `http://localhost:8080/download/${messageId}`;
                document.getElementById('linkContainer').style.display = "block";
                status.innerText = "வெற்றி!";
            } catch (err) {
                status.innerText = "தவறு: " + err.message;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
