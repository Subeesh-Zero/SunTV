<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram File Uploader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 600;
        }
        .file-input {
            margin-bottom: 20px;
        }
        .file-label {
            display: block;
            background: #f0f0f0;
            border: 2px dashed #999;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .file-label:hover {
            border-color: #667eea;
            background: #e8e8e8;
        }
        .file-label i {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 10px;
        }
        .file-label span {
            display: block;
            color: #666;
        }
        #fileInput {
            display: none;
        }
        .button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .button:hover {
            transform: translateY(-2px);
        }
        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        #status {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            word-break: break-all;
        }
        .success {
            color: #2ecc71;
        }
        .error {
            color: #e74c3c;
        }
        a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover {
            text-decoration: underline;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 Telegram File Uploader</h1>
        <div class="file-input">
            <label for="fileInput" class="file-label" id="fileLabel">
                <i>📁</i>
                <span>Click to select a file</span>
            </label>
            <input type="file" id="fileInput">
        </div>
        <button class="button" id="uploadBtn" disabled>Upload to Telegram</button>
        <div id="status">
            <p>Ready to upload...</p>
        </div>
        <div class="footer">
            Connected to local backend at <strong>http://localhost:8080</strong>
        </div>
    </div>

    <script>
        // Configuration - change this if your backend runs elsewhere
        const API_URL = "http://localhost:8080";

        const fileInput = document.getElementById('fileInput');
        const fileLabel = document.getElementById('fileLabel');
        const uploadBtn = document.getElementById('uploadBtn');
        const statusDiv = document.getElementById('status');

        // Update label when file is selected
        fileInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                fileLabel.innerHTML = `<i>📄</i><span>${this.files[0].name}</span>`;
                uploadBtn.disabled = false;
            } else {
                fileLabel.innerHTML = `<i>📁</i><span>Click to select a file</span>`;
                uploadBtn.disabled = true;
            }
        });

        // Handle upload
        uploadBtn.addEventListener('click', async function() {
            const file = fileInput.files[0];
            if (!file) {
                statusDiv.innerHTML = '<p class="error">❌ No file selected</p>';
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            statusDiv.innerHTML = '<p>⏳ Uploading to Telegram... (please wait)</p>';
            uploadBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/upload`, {
                    method: 'POST',
                    body: formData,
                    mode: 'cors'
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server error (${response.status}): ${errorText}`);
                }

                const data = await response.json();
                if (data.success) {
                    const downloadUrl = `${API_URL}${data.download_url}`;
                    statusDiv.innerHTML = `
                        <p class="success">✅ Upload successful!</p>
                        <p>📥 Download link: <a href="${downloadUrl}" target="_blank">${downloadUrl}</a></p>
                        <p><small>Right-click and "Save as..." to download</small></p>
                    `;
                } else {
                    statusDiv.innerHTML = `<p class="error">❌ Upload failed: ${data.error}</p>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
            } finally {
                uploadBtn.disabled = false;
            }
        });

        // Optional: drag & drop enhancements
        fileLabel.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileLabel.style.borderColor = '#667eea';
            fileLabel.style.background = '#e8e8e8';
        });

        fileLabel.addEventListener('dragleave', (e) => {
            e.preventDefault();
            fileLabel.style.borderColor = '#999';
            fileLabel.style.background = '#f0f0f0';
        });

        fileLabel.addEventListener('drop', (e) => {
            e.preventDefault();
            fileLabel.style.borderColor = '#999';
            fileLabel.style.background = '#f0f0f0';
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                fileLabel.innerHTML = `<i>📄</i><span>${e.dataTransfer.files[0].name}</span>`;
                uploadBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
